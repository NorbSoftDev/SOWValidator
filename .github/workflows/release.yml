name: Release

# Publishes a Windows binary as a release asset whenever a version tag is
# pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The binary is built from the tagged commit by the runner, so what users
# download always matches the source at that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        # -trimpath keeps build-machine paths out of the binary;
        # -s -w drop the symbol table and DWARF data to shrink it.
        run: go build -trimpath -ldflags="-s -w" -o sowvalidator.exe .

      - name: Checksum
        run: sha256sum sowvalidator.exe | tee sowvalidator.exe.sha256

      # Uses the gh CLI preinstalled on the runner rather than a third-party
      # action, so nothing outside GitHub's own tooling touches the release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            sowvalidator.exe sowvalidator.exe.sha256
